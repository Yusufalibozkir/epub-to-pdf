# Deluxe EPUB-to-print-PDF pipeline config
# Missing keys keep the built-in defaults. You can delete anything you do not want to override.
# Override order: built-in defaults -> this config file -> explicit CLI flags.
#
# A6 pocket preset (105 x 148 mm), calibrated for a ~300 page interior on a novel of
# roughly 66k words. The 10.6pt body on 1.22 leading gives an 85 mm column holding a
# ~56 character measure at 26 lines per page. Changing body_size_pt or line_height moves
# the page count roughly with the square of the change, so re-check extent if you edit them.

title: ""
trim_size: "A6"
body_size_pt: 10.6
line_height: 1.22
font_stack: "\"EB Garamond\", \"Cormorant Garamond\", Garamond, Georgia, serif"
embed_font_files: true
font_dir: "fonts"
embedded_font_family: "EB Garamond"
embedded_font_regular: "EBGaramond-wght.ttf"
embedded_font_italic: "EBGaramond-Italic-wght.ttf"
embedded_font_weight: "400 800"
text_color: "#111"
body_font_weight: "400"
hyphenate: true
justify_prose: true
margin_top_mm: 10.0
margin_side_mm: 10.0
margin_bottom_mm: 12.0
front_margin_top_mm: 13.0
front_margin_bottom_mm: 12.0
runner_font_pt: 7.9
runner_left_font_pt: null
runner_right_font_pt: null
runner_letter_spacing_em: 0.03
runner_rule_gap_mm: 1.8
runner_body_clearance_mm: 3.5
runner_rule_y_mm: 9.0
runner_title_top_mm: 4.2
runner_rule_weight_pt: 0.35
runner_rule_color: "#222"
runner_layout: "right_title_full_rule"
runner_rule_style: "full_width"
runner_collection_transform: "uppercase"
runner_work_transform: "none"
folio_font_pt: 8.5
front_folio_font_pt: 8.0
paragraph_indent_em: 1.1
blockquote_side_margin_mm: 4.5
blockquote_font_percent: 94.0
major_opener_top_margin_mm: 26.0
major_opener_bottom_margin_mm: 9.0
major_work_description_gap_mm: 2.8
major_work_font_pt: 17.0
collection_division_font_pt: 17.5
work_description_font_delta_pt: -1.0
work_description_bottom_margin_mm: 4.0
author_note_bottom_margin_mm: 5.0
part_heading_font_pt: 10.6
part_heading_margin_bottom_mm: 3.5
chapter_section_font_pt: 10.6
chapter_section_margin_top_mm: 3.2
chapter_section_margin_bottom_mm: 2.0
subdivision_font_pt: 11.2
subdivision_margin_top_mm: 4.0
subdivision_margin_bottom_mm: 2.8
h3_font_pt: 11.8
minor_heading_font_pt: 10.4
toc_title_font_pt: 15.5
toc_level_1_font_pt: 10.1
toc_level_2_font_pt: 9.6
toc_level_3_font_pt: 9.2
toc_level_4_font_pt: 8.8
toc_line_height: 1.06
toc_entry_gap_mm: 1.8
verse_max_width_mm: 85.0
verse_line_height: 1.14
verse_hanging_indent_em: 1.15
verse_block_margin_top_mm: 2.4
verse_block_margin_bottom_mm: 2.8
verse_font_stack: ""
verse_font_size_delta_pt: -0.4
cast_max_width_mm: 85.0
cast_line_height: 1.12
image_policy: "functional"
smart_punctuation: true
rule_pack_dir: "rules"
rule_packs: "generic_epub.yaml"
write_ai_rule_suggestions: true
include_half_title_page: false
include_title_page: true
half_title_page_font_pt: 17.0
title_page_font_pt: 22.5
title_page_collection_font_pt: 16.0
title_page_of_font_pt: 11.4
title_page_subtitle: ""
include_source_note: false
source_note_text: "Prepared as a single-page A6 print interior from the supplied EPUB source."
major_opener_blank_before: true
major_opener_blank_after: true
strict: false
no_sample_requirement: false
